{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>Your Profile</h1>
    <p>Manage your personal information and linked accounts.</p>
</div>

<div class="profile-container glass-panel">
    <form method="POST" action="{{ url_for('main.profile') }}" class="profile-form">
        <div class="form-section">
            <h3>Personal Info</h3>
            <div class="input-group">
                <label for="name">Full Name</label>
                <div class="input-wrapper">
                    <i class="ph ph-user"></i>
                    <input type="text" id="name" name="name" value="{{ user.name }}" required>
                </div>
            </div>
            <div class="input-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <i class="ph ph-envelope"></i>
                    <input type="email" id="email" value="{{ user.email }}" disabled class="disabled-input">
                </div>
                <small>Email cannot be changed.</small>
            </div>
            <div class="input-group">
                <label for="roll_no">Roll Number</label>
                <div class="input-wrapper">
                    <i class="ph ph-identification-card"></i>
                    <input type="text" id="roll_no" name="roll_no" value="{{ user.roll_no or '' }}">
                </div>
            </div>
        </div>

        <div class="form-section">
            <h3>Platform Usernames</h3>
            <div class="input-group">
                <label for="leetcode_username">LeetCode Username</label>
                <div class="input-wrapper">
                    <i class="ph ph-code"></i>
                    <input type="text" id="leetcode_username" name="leetcode_username" value="{{ user.leetcode_username or '' }}">
                </div>
            </div>
            <div class="input-group">
                <label for="hackerrank_username">HackerRank Username</label>
                <div class="input-wrapper">
                    <i class="ph ph-code-block"></i>
                    <input type="text" id="hackerrank_username" name="hackerrank_username" value="{{ user.hackerrank_username or '' }}">
                </div>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
