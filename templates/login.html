{% extends "base.html" %}

{% block auth_content %}
<div class="login-card glass-panel">
    <div class="login-header">
        <div class="logo-icon"><i class="ph ph-code"></i></div>
        <h1>Welcome Back</h1>
        <p>Log in to continue your coding journey</p>
    </div>
    
    <form method="POST" action="{{ url_for('auth.login') }}" class="login-form">
        <div class="input-group">
            <label for="email">Email</label>
            <div class="input-wrapper">
                <i class="ph ph-envelope"></i>
                <input type="email" id="email" name="email" placeholder="student@example.com" required>
            </div>
        </div>
        
        <div class="input-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
                <i class="ph ph-lock-key"></i>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Sign In <i class="ph ph-arrow-right"></i></button>
        
        <div style="text-align: center; margin-top: 20px;">
            <p style="color: var(--text-muted); font-size: 0.9rem;">
                Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: var(--primary); text-decoration: none;">Register here</a>
            </p>
        </div>
    </form>
</div>
{% endblock %}
